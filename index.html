<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MellyFX Trading Bot</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#07111f;
  color:white;
}
.container{
  max-width:500px;
  margin:auto;
  padding:18px;
}
h1{text-align:center;margin-bottom:5px}
.subtitle{
  text-align:center;
  color:#9caec4;
  margin-bottom:20px;
}
.card{
  background:#101d2d;
  border-radius:15px;
  padding:16px;
  margin-bottom:15px;
}
label{
  display:block;
  margin:10px 0 6px;
  color:#b9c7d8;
}
select,input,button{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:0;
  font-size:16px;
}
select,input{
  background:#18283b;
  color:white;
}
button{
  margin-top:10px;
  font-weight:bold;
  cursor:pointer;
}
.start{background:#18b66b;color:white}
.stop{background:#d94747;color:white}
.status{
  text-align:center;
  padding:12px;
  border-radius:10px;
  background:#18283b;
  margin-top:10px;
}
.price{
  font-size:28px;
  text-align:center;
  margin:12px 0;
}
.digit{
  font-size:45px;
  font-weight:bold;
  text-align:center;
}
.grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}
.dbox{
  background:#18283b;
  padding:8px 3px;
  text-align:center;
  border-radius:8px;
  font-size:13px;
}
.signal{
  text-align:center;
  font-size:20px;
  font-weight:bold;
  padding:15px;
}
.small{
  color:#8fa3ba;
  font-size:13px;
  text-align:center;
}
</style>
</head>

<body>

<div class="container">

<h1>📊 MellyFX Trading Bot</h1>
<div class="subtitle">Deriv Digit Analysis Dashboard</div>

<div class="card">

<label>Market</label>

<select id="market">
<option>Loading markets...</option>
</select>

<label>Stake</label>
<input id="stake" type="number" value="1" min="0.35">

<label>Prediction Digit</label>
<input id="prediction" type="number" min="0" max="9" value="2">

<button class="start" onclick="startBot()">START BOT</button>
<button class="stop" onclick="stopBot()">STOP BOT</button>

<div id="status" class="status">Connecting...</div>

</div>

<div class="card">

<div class="small">LIVE PRICE</div>
<div id="price" class="price">--</div>

<div class="small">LATEST DIGIT</div>
<div id="digit" class="digit">-</div>

</div>

<div class="card">

<h3>Digit Frequency</h3>

<div class="grid" id="digits"></div>

</div>

<div class="card">

<h3>Zone Analysis</h3>

<p>0–2 Combined: <b id="lowZone">0%</b></p>
<p>7–9 Combined: <b id="highZone">0%</b></p>
<p>Strongest Digit: <b id="strongest">-</b></p>

<div id="signal" class="signal">⏳ COLLECTING DATA</div>

</div>

<div class="card">
<div class="small">
Public market data only • No real trades are placed
</div>
</div>

</div>

<script>

const ws = new WebSocket("wss://ws.derivws.com/websockets/v3");

let markets = [];
let digits = [];
let currentSymbol = "";
let botRunning = false;

const marketSelect = document.getElementById("market");
const statusBox = document.getElementById("status");

ws.onopen = function(){

  statusBox.innerText = "🟢 Connected";

  ws.send(JSON.stringify({
    active_symbols:"brief",
    product_type:"basic"
  }));

};

ws.onmessage = function(event){

  const data = JSON.parse(event.data);

  /* LOAD MARKETS */

  if(data.active_symbols){

    markets = data.active_symbols.filter(x => {

      const name =
        (x.display_name || "") +
        " " +
        (x.underlying_symbol_name || "") +
        " " +
        (x.symbol || "") +
        " " +
        (x.underlying_symbol || "");

      return name.toLowerCase().includes("volatility") ||
             name.toLowerCase().includes("vol") ||
             name.toLowerCase().includes("hz");

    });

    marketSelect.innerHTML = "";

    markets.forEach((m,index)=>{

      const symbol = m.symbol || m.underlying_symbol;

      const name =
        m.display_name ||
        m.underlying_symbol_name ||
        symbol;

      const option = document.createElement("option");

      option.value = symbol;
      option.textContent = name;

      marketSelect.appendChild(option);

    });

    if(markets.length > 0){

      currentSymbol =
        markets[0].symbol ||
        markets[0].underlying_symbol;

      subscribe(currentSymbol);

    }else{

      statusBox.innerText =
        "⚠️ No Volatility markets found";

    }

  }

  /* TICK DATA */

  if(data.tick){

    const tick = data.tick;

    const price = tick.quote;

    document.getElementById("price").innerText = price;

    const text = String(price);

    let lastDigit =
      parseInt(text.charAt(text.length - 1));

    if(!isNaN(lastDigit)){

      document.getElementById("digit").innerText =
        lastDigit;

      digits.push(lastDigit);

      if(digits.length > 100)
        digits.shift();

      updateAnalysis();

    }

  }

};

ws.onerror = function(){

  statusBox.innerText =
    "🔴 Connection error";

};

ws.onclose = function(){

  statusBox.innerText =
    "🔴 Disconnected";

};

function subscribe(symbol){

  if(!ws || ws.readyState !== 1)
    return;

  ws.send(JSON.stringify({
    forget_all:"ticks"
  }));

  ws.send(JSON.stringify({
    ticks:symbol,
    subscribe:1
  }));

  currentSymbol = symbol;

  digits = [];

  document.getElementById("status").innerText =
    "🟢 Connected • " + symbol;

}

marketSelect.addEventListener("change",function(){

  subscribe(this.value);

});

function updateAnalysis(){

  const boxes =
    document.getElementById("digits");

  boxes.innerHTML = "";

  const counts =
    Array(10).fill(0);

  digits.forEach(d=>{
    counts[d]++;
  });

  const total = digits.length;

  for(let i=0;i<10;i++){

    const percentage =
      total ? (counts[i]/total)*100 : 0;

    const box =
      document.createElement("div");

    box.className="dbox";

    box.innerHTML =
      "<b>"+i+"</b><br>"+
      percentage.toFixed(1)+"%";

    boxes.appendChild(box);

  }

  if(total === 0) return;

  const low =
    ((counts[0]+counts[1]+counts[2])/total)*100;

  const high =
    ((counts[7]+counts[8]+counts[9])/total)*100;

  document.getElementById("lowZone").innerText =
    low.toFixed(1)+"%";

  document.getElementById("highZone").innerText =
    high.toFixed(1)+"%";

  let strongest = 0;

  for(let i=1;i<10;i++){

    if(counts[i] > counts[strongest])
      strongest=i;

  }

  document.getElementById("strongest").innerText =
    strongest;

  const signal =
    document.getElementById("signal");

  if(total < 30){

    signal.innerText =
      "⏳ COLLECTING DATA";

  }else if(low < 10.2 && high >= 10.2){

    signal.innerText =
      "🟢 OVER 2 SETUP";

  }else if(high < 10.2 && low >= 10.2){

    signal.innerText =
      "🟢 UNDER 7 SETUP";

  }else if(low < 10.2 && high < 10.2){

    signal.innerText =
      "🟡 BOTH CONDITIONS";

  }else{

    signal.innerText =
      "⏸️ WAIT";

  }

}

function startBot(){

  botRunning=true;

  statusBox.innerText =
    "🟢 BOT RUNNING";

}

function stopBot(){

  botRunning=false;

  statusBox.innerText =
    "⛔ BOT STOPPED";

}

</script>

</body>
</html>

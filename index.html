<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MellyFX Deriv Test</title>

<style>
body{
background:#07111f;
color:white;
font-family:Arial;
padding:20px
}
.card{
background:#101d2d;
padding:20px;
border-radius:15px;
margin-top:20px
}
#status{
font-size:22px;
font-weight:bold;
margin-bottom:15px
}
#log{
background:#050b12;
padding:15px;
border-radius:10px;
font-size:13px;
word-break:break-word;
line-height:1.6
}
button{
width:100%;
padding:14px;
margin-top:15px;
border:0;
border-radius:9px;
font-size:16px;
font-weight:bold
}
</style>
</head>

<body>

<h1>🔧 MellyFX Deriv Test</h1>

<div class="card">

<div id="status">
Starting...
</div>

<div id="log">
Preparing connection...
</div>

<button onclick="testLegacy()">
TEST DERIV CONNECTION
</button>

</div>

<script>

let ws;

const status =
document.getElementById("status");

const log =
document.getElementById("log");


function write(text){

log.innerHTML +=
"<br>" + text;

}


function testLegacy(){

if(ws){

try{
ws.close();
}catch(e){}

}


status.innerText =
"🔄 Connecting...";

log.innerHTML =
"Opening Deriv WebSocket...";


ws =
new WebSocket(
"wss://ws.binaryws.com/websockets/v3"
);


ws.onopen = function(){

status.innerText =
"🟢 CONNECTED";

write(
"SUCCESS: WebSocket opened."
);


/*
Request only active symbols.
No product_type.
*/

ws.send(
JSON.stringify({

active_symbols:"brief",

req_id:1

})
);

};


ws.onmessage =
function(event){

write(
"RESPONSE RECEIVED:"
);

write(
event.data
);


let data;

try{

data =
JSON.parse(event.data);

}catch(e){

return;

}


if(data.error){

status.innerText =
"⚠️ DERIV ERROR";

write(
"Error: " +
data.error.message
);

return;

}


if(
data.msg_type ===
"active_symbols"
){

const list =
data.active_symbols || [];

status.innerText =
"🟢 CONNECTED — " +
list.length +
" MARKETS RECEIVED";

write(
"Markets received successfully."
);

write(
"First market: " +
JSON.stringify(
list[0] || {}
)
);

}

};


ws.onerror =
function(){

status.innerText =
"🔴 WEBSOCKET ERROR";

write(
"Browser reported a WebSocket error."
);

};


ws.onclose =
function(event){

status.innerText =
"🔴 DISCONNECTED";

write(
"Close code: " +
event.code
);

write(
"Close reason: " +
(event.reason || "none")
);

};

}


/* Automatically test */

testLegacy();

</script>

</body>
</html>

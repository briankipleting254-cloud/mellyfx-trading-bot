<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MellyFX Trading Bot</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#07111f;
color:#fff;
font-family:Arial,sans-serif
}
.container{
max-width:520px;
margin:auto;
padding:16px
}
h1{text-align:center;margin:8px 0}
.sub{text-align:center;color:#9fb0c5;margin-bottom:18px}
.card{
background:#101d2d;
border-radius:15px;
padding:16px;
margin-bottom:14px
}
label{
display:block;
margin:10px 0 6px;
color:#b9c7d8
}
select,input,button{
width:100%;
padding:13px;
border:0;
border-radius:9px;
font-size:16px
}
select,input{
background:#1a2a3d;
color:white
}
button{
margin-top:10px;
font-weight:bold
}
.start{background:#16b66a;color:white}
.stop{background:#d94b4b;color:white}
.status{
margin-top:10px;
padding:12px;
background:#18283b;
border-radius:9px;
text-align:center
}
.price{
font-size:28px;
text-align:center;
margin:10px
}
.latest{
text-align:center;
color:#9fb0c5
}
.digit{
font-size:48px;
font-weight:bold;
text-align:center
}
.grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:7px
}
.box{
background:#19293b;
padding:9px 3px;
border-radius:8px;
text-align:center;
font-size:13px
}
.signal{
text-align:center;
font-size:19px;
font-weight:bold;
padding:14px
}
.small{
font-size:12px;
color:#91a4bb;
text-align:center
}
</style>
</head>

<body>

<div class="container">

<h1>📊 MellyFX Trading Bot</h1>
<div class="sub">Deriv Digit Analysis Dashboard</div>

<div class="card">

<label>Volatility Market</label>

<select id="market">
<option>Connecting to Deriv...</option>
</select>

<label>Stake</label>
<input id="stake" type="number" value="1" min="0.35">

<label>Prediction Digit</label>
<input id="prediction" type="number" value="2" min="0" max="9">

<button class="start" onclick="startBot()">START BOT</button>
<button class="stop" onclick="stopBot()">STOP BOT</button>

<div id="status" class="status">Connecting...</div>

</div>

<div class="card">

<div class="latest">LIVE PRICE</div>
<div id="price" class="price">--</div>

<div class="latest">LATEST DIGIT</div>
<div id="latestDigit" class="digit">-</div>

</div>

<div class="card">

<h3>Digit Frequency</h3>

<div id="digitGrid" class="grid"></div>

</div>

<div class="card">

<h3>Zone Analysis</h3>

<p>0–2 Combined: <b id="zoneLow">0%</b></p>
<p>7–9 Combined: <b id="zoneHigh">0%</b></p>
<p>Strongest Digit: <b id="strongest">-</b></p>

<div id="signal" class="signal">
⏳ COLLECTING DATA
</div>

</div>

<div class="card">
<div class="small">
PUBLIC MARKET DATA • NO REAL TRADES
</div>
</div>

</div>

<script>

/* =========================
   DERIV PUBLIC CONNECTION
========================= */

const WS_URL =
"wss://api.derivws.com/trading/v1/options/ws/public";

let ws;
let markets=[];
let currentSymbol="";
let digitHistory=[];
let botRunning=false;

/* =========================
   STATUS
========================= */

function setStatus(text){
document.getElementById("status").innerText=text;
}

/* =========================
   CONNECT
========================= */

function connect(){

setStatus("🔄 Connecting to Deriv...");

ws=new WebSocket(WS_URL);

ws.onopen=function(){

setStatus("🟢 Connected");

requestMarkets();

};

ws.onmessage=function(event){

try{

const data=JSON.parse(event.data);

handleMessage(data);

}catch(error){

console.log("Message error:",error);

}

};

ws.onerror=function(){

setStatus("🔴 WebSocket error");

};

ws.onclose=function(){

setStatus("🔴 Disconnected — reconnecting...");

setTimeout(connect,3000);

};

}

/* =========================
   GET MARKETS
========================= */

function requestMarkets(){

ws.send(JSON.stringify({

active_symbols:"brief"

}));

}

/* =========================
   HANDLE DATA
========================= */

function handleMessage(data){

console.log(data);

if(data.error){

setStatus("⚠️ "+data.error.message);

return;

}

/* ACTIVE SYMBOLS */

if(data.msg_type==="active_symbols"){

const list=data.active_symbols || [];

markets=list.filter(function(item){

const name=(
item.underlying_symbol_name ||
""
).toLowerCase();

const symbol=(
item.underlying_symbol ||
""
).toLowerCase();

return name.includes("volatility") ||
symbol.includes("hz");

});

populateMarkets();

}

/* TICK */

if(data.msg_type==="tick" && data.tick){

const tick=data.tick;

if(
tick.symbol &&
tick.symbol===currentSymbol
){

updateTick(tick);

}

}

}

/* =========================
   MARKET DROPDOWN
========================= */

function populateMarkets(){

const select=
document.getElementById("market");

select.innerHTML="";

if(markets.length===0){

select.innerHTML=
"<option>No Volatility markets found</option>";

return;

}

markets.forEach(function(item){

const option=
document.createElement("option");

option.value=item.underlying_symbol;

option.textContent=
item.underlying_symbol_name ||
item.underlying_symbol;

select.appendChild(option);

});

currentSymbol=
markets[0].underlying_symbol;

subscribe(currentSymbol);

}

/* =========================
   SUBSCRIBE
========================= */

function subscribe(symbol){

if(!ws || ws.readyState!==WebSocket.OPEN)
return;

currentSymbol=symbol;

digitHistory=[];

ws.send(JSON.stringify({

ticks:symbol,
subscribe:1

}));

setStatus("🟢 Connected • "+symbol);

}

/* =========================
   MARKET CHANGE
========================= */

document.getElementById("market")
.addEventListener("change",function(){

subscribe(this.value);

});

/* =========================
   TICK PROCESSING
========================= */

function updateTick(tick){

const price=tick.quote;

document.getElementById("price").innerText=
price;

/*
Use pip_size when available
to determine decimal places.
*/

let digit;

if(
typeof tick.pip_size==="number" &&
tick.pip_size>0
){

const decimals=
Math.max(
0,
Math.round(
-Math.log10(tick.pip_size)
)
);

const formatted=
Number(price).toFixed(decimals);

digit=
Number(
formatted.charAt(
formatted.length-1
)
);

}else{

const text=String(price);

digit=
Number(
text.replace(/\D/g,"").slice(-1)
);

}

if(!Number.isInteger(digit))
return;

document.getElementById("latestDigit")
.innerText=digit;

digitHistory.push(digit);

if(digitHistory.length>100)
digitHistory.shift();

updateAnalysis();

}

/* =========================
   ANALYSIS
========================= */

function updateAnalysis(){

const counts=
Array(10).fill(0);

digitHistory.forEach(function(d){

if(d>=0 && d<=9)
counts[d]++;

});

const total=digitHistory.length;

const grid=
document.getElementById("digitGrid");

grid.innerHTML="";

for(let i=0;i<10;i++){

const percentage=
total ?
(counts[i]/total)*100 :
0;

const box=
document.createElement("div");

box.className="box";

box.innerHTML=
"<b>"+i+"</b><br>"+
percentage.toFixed(1)+"%";

grid.appendChild(box);

}

if(total===0)
return;

const low=
(
counts[0]+
counts[1]+
counts[2]
)/total*100;

const high=
(
counts[7]+
counts[8]+
counts[9]
)/total*100;

document.getElementById("zoneLow")
.innerText=low.toFixed(1)+"%";

document.getElementById("zoneHigh")
.innerText=high.toFixed(1)+"%";

/* STRONGEST DIGIT */

let strongest=0;

for(let i=1;i<10;i++){

if(counts[i]>counts[strongest])
strongest=i;

}

document.getElementById("strongest")
.innerText=strongest;

/* SIGNAL */

const signal=
document.getElementById("signal");

if(total<30){

signal.innerText=
"⏳ COLLECTING DATA";

}else if(low<10.2 && high>=10.2){

signal.innerText=
"🟢 OVER 2 SETUP";

}else if(high<10.2 && low>=10.2){

signal.innerText=
"🟢 UNDER 7 SETUP";

}else if(low<10.2 && high<10.2){

signal.innerText=
"🟡 BOTH CONDITIONS";

}else{

signal.innerText=
"⏸️ WAIT";

}

}

/* =========================
   BOT BUTTONS
========================= */

function startBot(){

botRunning=true;

setStatus(
"🟢 BOT RUNNING — ANALYSIS ONLY"
);

}

function stopBot(){

botRunning=false;

setStatus(
"⛔ BOT STOPPED"
);

}

/* START */

connect();

</script>

</body>
</html>

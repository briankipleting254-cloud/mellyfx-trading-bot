<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MellyFX Connection Test</title>

<style>
body{
background:#07111f;
color:white;
font-family:Arial;
padding:20px;
text-align:center
}

.box{
background:#101d2d;
padding:20px;
border-radius:15px;
margin-top:20px
}

#status{
font-size:22px;
font-weight:bold;
margin:20px 0
}

#log{
background:#050b12;
padding:15px;
border-radius:10px;
text-align:left;
font-size:13px;
word-break:break-word
}
</style>
</head>

<body>

<h1>🔧 MellyFX Connection Test</h1>

<div class="box">

<div id="status">
Connecting...
</div>

<div id="log">
Starting test...
</div>

</div>

<script>

const status =
document.getElementById("status");

const log =
document.getElementById("log");

function show(text){

log.innerHTML +=
"<br>" + text;

}

const ws =
new WebSocket(
"wss://ws.binaryws.com/websockets/v3"
);

ws.onopen = function(){

status.innerText =
"🟢 CONNECTED";

show(
"WebSocket connection successful."
);

ws.send(JSON.stringify({

ping:1,

req_id:1

}));

};

ws.onmessage = function(event){

show(
"DERIV RESPONSE: " +
event.data
);

};

ws.onerror = function(){

status.innerText =
"🔴 CONNECTION ERROR";

show(
"WebSocket error occurred."
);

};

ws.onclose = function(event){

status.innerText =
"🔴 DISCONNECTED";

show(
"Close code: " +
event.code
);

show(
"Close reason: " +
(event.reason || "none")
);

};

</script>

</body>
</html>
